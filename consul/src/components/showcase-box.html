<a href="{{ url }}" target="_blank">
  <div class="showcase-box d-flex justify-content-center align-items-center mb-4">
    <div class="showcase-box-icon mr-3">
      <div class="d-flex justify-content-center align-items-center">
        <img
          class="mt-1"
          src="{{ img }}"
          data-attr-t
          alt-t="{{ img_alt_t }}"
        />
      </div>
    </div>
    <p data-t="{{ name_t }}">{{ name }}</p>
  </div>
</a>
